name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Unit tests only: the integration suite needs the 54.9M-row dataset, which is
# not committed (data/ is ignored). Run the full suite locally with:
#   pytest tests -v

jobs:
  lint-and-test:
    name: lint, build and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: python -m ruff check .

      - name: Compile check
        run: python -m compileall -q api python tests conftest.py

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Unit tests (no database required)
        run: python -m pytest -m "not integration" -v
